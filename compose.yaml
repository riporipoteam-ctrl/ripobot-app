name: ${COMPOSE_PROJECT_NAME:-ripobot}
services:
  ripo:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${RIPO_BASE_IMAGE:-ghcr.io/riporipoteam-ctrl/ripobot-app:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${RIPO_LOCAL_IMAGE:-ripobot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${RIPO_BIND_ADDRESS:-127.0.0.1}:${RIPO_HTTP_PORT:-8080}:80"
    environment:
      RIPO_PORT: "8799"
      RIPO_WEBHOOK_PORT: "8800"
      RIPO_PUBLIC_URL: ${RIPO_PUBLIC_URL:-http://localhost:${RIPO_HTTP_PORT:-8080}}
      RIPO_WEBHOOK_PUBLIC_URL: ${RIPO_WEBHOOK_PUBLIC_URL:-${RIPO_PUBLIC_URL:-http://localhost:${RIPO_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('ripobot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:ripo
    environment:
      RIPO_HTTPS_HOST: ${RIPO_HTTPS_HOST:-}
      RIPO_BIND_ADDRESS: ${RIPO_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export RIPO_UPSTREAM_SCHEME=http
        if [ -n "$$RIPO_HTTPS_HOST" ] && [ "$$RIPO_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "RIPO_HTTPS_HOST requires RIPO_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$RIPO_HTTPS_HOST" ]; then
          export RIPO_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      ripo:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${RIPO_DATA_EXTERNAL:-false}
    name: ${RIPO_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-ripobot}_data}
  caddy_data:
  caddy_config:
