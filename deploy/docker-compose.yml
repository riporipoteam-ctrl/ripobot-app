# One RipoBot tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `ripo` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose pull ripo && docker compose up -d     # prebuilt image
#   docker compose up -d --build                        # or build from source
services:
  ripo:
    build:
      context: ..
      args:
        ENGINES: ${ENGINES:-}
    # prebuilt on every main push; `docker compose up --build` builds from source instead
    image: ghcr.io/riporipoteam-ctrl/ripobot-app:latest
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      RIPO_PORT: "8799"
      RIPO_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      RIPO_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      RIPO_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      RIPO_SIGNIN_EMAILS: ${RIPO_SIGNIN_EMAILS:-}
      RIPO_SIGNIN_MEMBER_EMAILS: ${RIPO_SIGNIN_MEMBER_EMAILS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q ripobot"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:ripo"
    depends_on:
      ripo:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
