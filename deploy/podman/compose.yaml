name: ${COMPOSE_PROJECT_NAME:-ripobot-podman}
services:
  ripo:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/ripobot-podman:${RIPO_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${RIPO_DATA_ROOT:?Run setup.sh first}:${RIPO_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/ripo-podman.sock
    environment:
      HOME: ${RIPO_DATA_ROOT}
      RIPO_DATA_DIR: ${RIPO_DATA_ROOT}/.ripobot
      RIPO_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/ripo-podman.sock
      RIPO_PORT: ${RIPO_PORT:-8799}
      RIPO_WEBHOOK_PORT: ${RIPO_WEBHOOK_PORT:-8800}
      RIPO_PUBLIC_URL: ${RIPO_PUBLIC_URL:-http://localhost:8080}
      RIPO_WEBHOOK_PUBLIC_URL: ${RIPO_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$RIPO_PORT/api/health | grep -q ripobot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      ripo:
        condition: service_healthy
    environment:
      RIPO_HTTP_PORT: ${RIPO_HTTP_PORT:-8080}
      RIPO_PORT: ${RIPO_PORT:-8799}
      RIPO_WEBHOOK_PORT: ${RIPO_WEBHOOK_PORT:-8800}
      RIPO_HTTPS_HOST: ${RIPO_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
