name: RipoBot
options:
  bundleIdPrefix: com.ripoteam
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  RipoBot:
    type: application
    platform: iOS
    sources:
      - path: RipoBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ripoteam.ripobot
        PRODUCT_NAME: Ripo Bot
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Ripo Bot
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ripo Bot uses the microphone only when you start a voice conversation.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ripo Bot lets you choose images to send to your bots.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Ripo Bot can save images you choose to export.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        SUPPORTS_MACCATALYST: NO
schemes:
  RipoBot:
    build:
      targets:
        RipoBot: all
    run:
      config: Debug
    archive:
      config: Release
