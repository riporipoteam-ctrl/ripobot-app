name: Ripo Bot V4 production smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ripobot-v4-smoke.yml"
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test Ripo Bot V4 production
        shell: bash
        run: |
          set -euo pipefail
          API="https://ripobot-api.ripo-ripoteam.workers.dev"
          SITE="https://ripobot.sitey.my"
          EMAIL="ripobot-v4-smoke-${GITHUB_RUN_ID}@example.invalid"
          PASSWORD="RipoV4Smoke-2026-Test"

          echo "Checking V4 web release..."
          curl -fsS --retry 10 --retry-all-errors --retry-delay 4 "$SITE/" -o /tmp/site.html
          grep -qi "Ripo Bot" /tmp/site.html
          JS_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/site.html | head -1 | cut -d'"' -f2)"
          test -n "$JS_PATH"
          curl -fsS "$SITE$JS_PATH" -o /tmp/app.js
          grep -q "Ripo Bot Call" /tmp/app.js
          grep -q "Log In or Sign Up" /tmp/app.js
          grep -q "Daily +25" /tmp/app.js
          curl -fsS "$SITE/manifest.webmanifest" -o /tmp/manifest.json
          node -e "const d=require('/tmp/manifest.json'); if(d.theme_color!=='#ffffff'||d.background_color!=='#ffffff') process.exit(1)"
          curl -fsS "$SITE/sw.js" -o /tmp/sw.js
          grep -q "ripobot-shell-v4-20261024" /tmp/sw.js

          echo "Checking API..."
          curl -fsS "$API/api/health" -o /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(d.status!=='ok') process.exit(1)"

          echo "Registering disposable V4 account..."
          curl -fsS -X POST "$API/api/auth/register" -H "Content-Type: application/json"             --data "{\"name\":\"V4 Smoke\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" -o /tmp/register.json
          TOKEN="$(node -e "const d=require('/tmp/register.json'); if(!d.token||!d.user?.id) {console.error(d);process.exit(2)}; process.stdout.write(d.token)")"
          USER_ID="$(node -e "const d=require('/tmp/register.json'); process.stdout.write(d.user.id)")"
          WS_ID="$(node -e "const d=require('/tmp/register.json'); if(!d.defaultWorkspaceId) {console.error(d);process.exit(2)}; process.stdout.write(d.defaultWorkspaceId)")"
          node -e "const d=require('/tmp/register.json'); if(d.plan!=='free'||d.coins!==100||d.role!=='user'||!d.usage?.weekly||!d.usage?.threeHour) {console.error(d);process.exit(1)}"

          echo "Checking account + workspace rules..."
          curl -fsS "$API/api/account" -H "Authorization: Bearer $TOKEN" -o /tmp/account.json
          node -e "const d=require('/tmp/account.json'); if(d.workspaceCount!==1||d.storage?.limit!==262144000) {console.error(d);process.exit(1)}"
          curl -fsS "$API/api/workspaces" -H "Authorization: Bearer $TOKEN" -o /tmp/workspaces.json
          node -e "const d=require('/tmp/workspaces.json'); if(d.workspaces?.length!==1||d.limit!==1) {console.error(d);process.exit(1)}"

          STATUS="$(curl -sS -o /tmp/ws2.json -w '%{http_code}' -X POST "$API/api/workspaces" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"name":"Should Fail"}')"
          test "$STATUS" = "403"
          curl -fsS -X PUT "$API/api/workspaces/$WS_ID/rename" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"name":"V4 Test Workspace"}' -o /tmp/rename.json

          echo "Checking workspace state persistence..."
          curl -fsS -X PUT "$API/api/state" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data "{\"workspaceId\":\"$WS_ID\",\"agents\":[{\"id\":\"ripo\",\"name\":\"Ripo Bot\",\"role\":\"Chief of Staff\"}],\"conversations\":{\"ripo\":[{\"id\":\"m1\",\"role\":\"user\",\"content\":\"saved\"}]},\"teams\":[],\"archivedChats\":[{\"id\":\"a1\",\"title\":\"Saved chat\",\"messages\":[]}],\"onboarded\":true}" -o /tmp/stateput.json
          curl -fsS "$API/api/state?workspaceId=$WS_ID" -H "Authorization: Bearer $TOKEN" -o /tmp/state.json
          node -e "const d=require('/tmp/state.json'); if(d.workspaceName!=='V4 Test Workspace'||d.agents?.[0]?.role!=='Chief of Staff'||d.archivedChats?.[0]?.title!=='Saved chat') {console.error(d);process.exit(1)}"

          echo "Checking Ripo Coins..."
          curl -fsS -X POST "$API/api/coins/daily" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{}' -o /tmp/coins.json
          node -e "const d=require('/tmp/coins.json'); if(d.reward!==25||d.coins!==125) {console.error(d);process.exit(1)}"

          echo "Checking file upload/download/delete..."
          printf 'Ripo Bot V4 file smoke' > /tmp/ripo.txt
          curl -fsS -X POST "$API/api/files" -H "Authorization: Bearer $TOKEN" -F "workspaceId=$WS_ID" -F "file=@/tmp/ripo.txt;type=text/plain" -o /tmp/file.json
          FILE_ID="$(node -e "const d=require('/tmp/file.json'); if(!d.file?.id||d.file.workspaceId!=='$WS_ID') {console.error(d);process.exit(2)}; process.stdout.write(d.file.id)")"
          curl -fsS "$API/api/files/$FILE_ID" -H "Authorization: Bearer $TOKEN" -o /tmp/download.txt
          grep -q "Ripo Bot V4 file smoke" /tmp/download.txt
          curl -fsS -X DELETE "$API/api/files/$FILE_ID" -H "Authorization: Bearer $TOKEN" -o /tmp/delete.json

          echo "Checking FLUX image generation..."
          curl -fsS -X POST "$API/api/images/generate" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data "{\"workspaceId\":\"$WS_ID\",\"prompt\":\"minimal friendly purple robot blob icon on a clean white background\"}" -o /tmp/image.json
          IMAGE_ID="$(node -e "const d=require('/tmp/image.json'); if(!d.file?.id||d.file?.type!=='image/png') {console.error(d);process.exit(2)}; process.stdout.write(d.file.id)")"
          curl -fsS "$API/api/files/$IMAGE_ID" -H "Authorization: Bearer $TOKEN" -o /tmp/generated.png
          test "$(wc -c < /tmp/generated.png)" -gt 1000

          echo "Checking authenticated AI + usage + coins..."
          curl -fsS -X POST "$API/api/chat" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data "{\"workspaceId\":\"$WS_ID\",\"agentName\":\"Ripo Bot\",\"agentRole\":\"Chief of Staff\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly RIPO_V4_OK\"}],\"allowAgentAdmin\":true,\"allowRename\":true}" -o /tmp/chat.json
          node -e "const d=require('/tmp/chat.json'); if(!d.reply||!d.provider||!d.usage?.weekly||!(d.coins>=127)) {console.error(d);process.exit(1)}"

          echo "Checking automatic web search..."
          curl -fsS -X POST "$API/api/chat" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data "{\"workspaceId\":\"$WS_ID\",\"agentName\":\"Ripo Bot\",\"agentRole\":\"Chief of Staff\",\"messages\":[{\"role\":\"user\",\"content\":\"Search the web for the latest Cloudflare news and tell me one current item.\"}],\"allowAgentAdmin\":true}" -o /tmp/searchchat.json
          node -e "const d=require('/tmp/searchchat.json'); if(!d.reply||!Array.isArray(d.sources)||d.sources.length<1) {console.error(d);process.exit(1)}"

          echo "Checking workspace token stats..."
          curl -fsS "$API/api/workspaces" -H "Authorization: Bearer $TOKEN" -o /tmp/workspaces2.json
          node -e "const d=require('/tmp/workspaces2.json'); const w=d.workspaces?.[0]; if(!w||!(w.weeklyTokens>0)) {console.error(d);process.exit(1)}"

          echo "Checking admin protection..."
          STATUS="$(curl -sS -o /tmp/admin.json -w '%{http_code}' "$API/api/admin/users" -H "Authorization: Bearer $TOKEN")"
          test "$STATUS" = "403"

          echo "RIPO BOT V4 PRODUCTION SMOKE PASSED"
