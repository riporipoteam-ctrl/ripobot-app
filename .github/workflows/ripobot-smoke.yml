name: Ripo Bot production smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ripobot-smoke.yml"
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test production Ripo Bot
        shell: bash
        run: |
          set -euo pipefail
          API="https://ripobot-api.ripo-ripoteam.workers.dev"
          SITE="https://ripobot.sitey.my"
          EMAIL="ripobot-smoke-20261024-183945@example.invalid"
          PASSWORD="RipoSmoke-2026-Only-Test"

          echo "Checking public site..."
          curl -fsS --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE/" -o /tmp/site.html
          grep -qi "Ripo Bot" /tmp/site.html

          echo "Checking API health/config..."
          curl -fsS --retry 8 --retry-all-errors --retry-delay 5 "$API/api/health" -o /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(d.status!=='ok'||d.version!==2) process.exit(1)"
          curl -fsS "$API/api/config" -o /tmp/config.json
          node -e "const d=require('/tmp/config.json'); if(!d.authReady||!d.storageReady||!d.computerReady||!d.cloudflareAiReady) { console.error(d); process.exit(1) }"

          echo "Registering disposable account..."
          curl -fsS -X POST "$API/api/auth/register" -H "Content-Type: application/json"             --data "{\"name\":\"Ripo Smoke Test\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" -o /tmp/register.json
          TOKEN="$(node -e "const d=require('/tmp/register.json'); if(!d.token||!d.user?.id) process.exit(2); process.stdout.write(d.token)")"

          echo "Checking session + persistence..."
          curl -fsS "$API/api/auth/session" -H "Authorization: Bearer $TOKEN" -o /tmp/session.json
          node -e "const d=require('/tmp/session.json'); if(!d.cloud||!d.user?.id) process.exit(1)"
          curl -fsS -X PUT "$API/api/state" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data '{"agents":[{"id":"ripo","name":"Ripo Bot"}],"conversations":{},"teams":[],"onboarded":true}' -o /tmp/stateput.json
          curl -fsS "$API/api/state" -H "Authorization: Bearer $TOKEN" -o /tmp/state.json
          node -e "const d=require('/tmp/state.json'); if(!d.onboarded||d.agents?.[0]?.name!=='Ripo Bot') process.exit(1)"

          echo "Checking free KV file storage..."
          printf 'Ripo Bot KV smoke test' > /tmp/smoke.txt
          curl -fsS -X POST "$API/api/files" -H "Authorization: Bearer $TOKEN" -F "file=@/tmp/smoke.txt;type=text/plain" -o /tmp/file.json
          FILE_ID="$(node -e "const d=require('/tmp/file.json'); if(!d.file?.id) process.exit(2); process.stdout.write(d.file.id)")"
          curl -fsS "$API/api/files/$FILE_ID" -H "Authorization: Bearer $TOKEN" -o /tmp/download.txt
          grep -q "Ripo Bot KV smoke test" /tmp/download.txt

          echo "Checking Ripo Computer Lite..."
          curl -fsS "$API/api/computer/status" -H "Authorization: Bearer $TOKEN" -o /tmp/computer.json
          node -e "const d=require('/tmp/computer.json'); if(!d.configured||d.provider!=='Ripo Computer Lite') process.exit(1)"
          curl -fsS -X POST "$API/api/computer/exec" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"command":"echo smoke-ok > verify.txt"}' -o /tmp/exec1.json
          curl -fsS -X POST "$API/api/computer/exec" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"command":"cat verify.txt"}' -o /tmp/exec2.json
          node -e "const d=require('/tmp/exec2.json'); if(d.stdout!=='smoke-ok') { console.error(d); process.exit(1) }"

          echo "Checking web search..."
          curl -fsS -X POST "$API/api/search" -H "Content-Type: application/json" --data '{"query":"Cloudflare"}' -o /tmp/search.json
          node -e "const d=require('/tmp/search.json'); if(!Array.isArray(d.results)) process.exit(1)"

          echo "Checking AI chat..."
          curl -fsS -X POST "$API/api/chat" -H "Content-Type: application/json"             --data '{"agentName":"Ripo Bot","agentRole":"Main agent","messages":[{"role":"user","content":"Reply with exactly: RIPO_SMOKE_OK"}]}' -o /tmp/chat.json
          node -e "const d=require('/tmp/chat.json'); if(!d.reply||!d.provider) { console.error(d); process.exit(1) }; console.log('AI provider:', d.provider)"

          echo "RIPO BOT PRODUCTION SMOKE TEST PASSED"
