name: Ripo Bot V5 voice smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v5-voice-smoke.yml"
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - name: Verify neural TTS and transcription
        shell: bash
        run: |
          set -euo pipefail
          API="https://ripobot-api.ripo-ripoteam.workers.dev"
          EMAIL="ripobot-v5-voice-${GITHUB_RUN_ID}@example.invalid"
          PASSWORD="RipoVoiceSmoke-2026-Test"

          curl -fsS -X POST "$API/api/auth/register"             -H "Content-Type: application/json"             --data "{\"name\":\"V5 Voice Smoke\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}"             -o /tmp/register.json

          TOKEN="$(node -e "const d=require('/tmp/register.json'); if(!d.token) process.exit(2); process.stdout.write(d.token)")"

          curl -fsS -X POST "$API/api/voice/speak"             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data '{"text":"Ripo voice test is working clearly.","lang":"en"}'             -o /tmp/voice.mp3

          test "$(wc -c < /tmp/voice.mp3)" -gt 1000

          curl -fsS -X POST "$API/api/voice/transcribe"             -H "Authorization: Bearer $TOKEN"             -F "audio=@/tmp/voice.mp3;type=audio/mpeg"             -o /tmp/transcript.json

          node -e "const d=require('/tmp/transcript.json'); const t=String(d.text||'').toLowerCase(); if(!t || !t.includes('ripo') || !t.includes('voice')) { console.error(d); process.exit(1) }"
          echo "RIPO BOT V5 VOICE SMOKE PASSED"
