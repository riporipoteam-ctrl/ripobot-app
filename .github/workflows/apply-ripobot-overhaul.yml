name: Apply Ripo Bot V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".ripo-deploy/**"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ripobot-v2-deploy
  cancel-in-progress: false

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply generated Ripo Bot V2 overlay
        run: |
          rm -rf /tmp/ripobot-v2
          mkdir -p /tmp/ripobot-v2
          unzip -oq .ripo-deploy/ripobot-overhaul.zip -d /tmp/ripobot-v2
          rsync -a /tmp/ripobot-v2/ripobot-overhaul/ ./
          rm -rf .ripo-deploy
          rm -f .github/workflows/apply-ripobot-overhaul.yml
          git config user.name "Ripo Bot Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Ripo Bot V2 free-plan overhaul"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: apply-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
