services:
  - type: web
    name: ripobot-app
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HF_TOKEN
        sync: false
      - key: RIPO_ACCESS_CODE
        sync: false
